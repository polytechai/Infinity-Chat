<!DOCTYPE html>
<html lang="bn" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- Primary Meta Tags -->
    <title>Infinity Chat - Real-Time Messenger & AI Assistant</title>
    <meta name="title" content="Infinity Chat - Real-Time Messenger & AI Assistant" />
    <meta
      name="description"
      content="Infinity Chat is a next-generation real-time PWA messenger with AI summarization, vanish mode, voice notes, and games."
    />

    <!-- Theme & Mobile Web App Capabilities -->
    <meta name="theme-color" content="#6366f1" />
    <meta name="background-color" content="#0a0d14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="InfinityChat" />

    <!-- Web Application Manifest for PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Google Fonts: Inter & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Splash & Base Rendering Setup */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0a0d14;
        color: #f8fafc;
        font-family: 'Plus Jakarta Sans', 'Hind Siliguri', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }

      /* Native app scrollbar look */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0d14;
      }
      ::-webkit-scrollbar-thumb {
        background: #29334d;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3e4c6d;
      }
    </style>
  </head>
  <body class="bg-[#0a0d14] text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
    <!-- React Root Mount Container -->
    <div id="root"></div>

    <!-- Main React Entry Point -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
